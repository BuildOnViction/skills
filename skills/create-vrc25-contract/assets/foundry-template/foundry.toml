[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Viction tooling and source verification track solc <= 0.8.19. Do not bump this.
solc = "0.8.19"
# solc 0.8.19 defaults to the "paris" EVM (no PUSH0). Pin it so a future solc/default
# change can't emit a shanghai PUSH0 the chain may reject.
evm_version = "paris"
optimizer = true
optimizer_runs = 200

remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
viction = "${VICTION_RPC}"
viction_testnet = "${VICTION_TESTNET_RPC}"
